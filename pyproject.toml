[project]
name = "clean-telegram-chat"
version = "0.1.0"
description = "Delete your own messages from Telegram supergroups"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kurigram>=2.2.26",
    "questionary>=2.1.1",
    "typesafe-sdk>=0.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
allowed-confusables = ["с", "а", "е", "о", "р", "х", "у", "г", "б", "д", "в", "к", "м", "н", "п", "т", "ф", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я", "В", "С", "Н"]  # кириллица в русских строках/комментариях
select = [
    "E", "F", "W",           # pycodestyle/pyflakes
    "I",                     # isort
    "B",                     # bugbear
    "UP",                    # pyupgrade
    "SIM",                   # simplify
    "RUF",
    "PL",                    # pylint
    "C4", "RET", "ARG", "PTH", "T20",
    "S",                     # bandit: no hardcoded secrets, etc.
]
ignore = [
    "PLR0913",  # много keyword-defaults (sleep, rng, log) — так задумано DI
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "S101",     # assert в тестах — это тест
    "PLR2004",  # magic numbers в тестах — литералы по спецификации
    "ARG",      # fakes mirror purge keyword arguments
    "T201",     # финальный print бегунка тестов
]
"people.py" = ["T201"]  # print — публичный вывод CLI
